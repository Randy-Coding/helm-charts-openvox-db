{{- if .Values.postgresql.internal.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openvoxdb.postgresqlFullname" . }}
  labels:
    {{- include "openvoxdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "openvoxdb.postgresqlFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "openvoxdb.postgresqlSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/postgresql-configmap.yaml") . | sha256sum }}
        {{- with .Values.postgresql.internal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openvoxdb.postgresqlSelectorLabels" . | nindent 8 }}
        {{- with .Values.postgresql.internal.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.internal.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.internal.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.internal.image.repository }}:{{ .Values.postgresql.internal.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.internal.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.internal.securityContext | nindent 12 }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.shared.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.shared.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openvoxdb.postgresqlSecretName" . }}
                  key: {{ .Values.postgresql.shared.usernameKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openvoxdb.postgresqlSecretName" . }}
                  key: {{ .Values.postgresql.shared.passwordKey | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgresql.internal.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-openvoxdb-extensions.sql
              subPath: 10-openvoxdb-extensions.sql
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.postgresql.internal.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "openvoxdb.postgresqlFullname" .) .Values.postgresql.internal.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: {{ include "openvoxdb.postgresqlFullname" . }}-init
      {{- with .Values.postgresql.internal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.internal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.internal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.internal.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
