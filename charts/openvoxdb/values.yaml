# -- Override generated resource names
nameOverride: ""
fullnameOverride: ""

# -- OpenVoxDB container image
image:
  repository: ghcr.io/openvoxproject/openvoxdb
  tag: 8.15.0-main
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Pod deployment, scheduling, security, and runtime configuration
replicaCount: 1
extraEnv: {}
extraEnvSecret: ""
resources: {}
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
podAnnotations: {}
podLabels: {}
updateStrategy:
  type: Recreate
terminationGracePeriodSeconds: 30

# -- Create or reuse a Kubernetes service account
serviceAccount:
  create: false
  # Generated from the release name when create is true and name is empty.
  name: ""
  annotations: {}

# -- Limit voluntary disruptions to available replicas
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # Mutually exclusive with minAvailable.
  maxUnavailable: ""

# -- Override container health checks
livenessProbe: {}
readinessProbe: {}
startupProbe: {}

# -- Inject additional containers, init containers, volumes, and mounts
extraContainers: []
extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []

# -- Expose the OpenVoxDB HTTP and HTTPS APIs
service:
  type: ClusterIP
  port: 8081
  httpPort: 8080
  annotations: {}
  labels: {}

# -- Run bundled PostgreSQL or connect to an external PostgreSQL service
postgresql:
  # -- Settings used by internal and external PostgreSQL
  shared:
    port: 5432
    database: puppetdb
    username: puppetdb
    existingSecret: ""
    usernameKey: username
    passwordKey: password

  # -- PostgreSQL instance managed by this chart
  internal:
    enabled: true
    # Generated when password and shared.existingSecret are empty.
    password: ""
    image:
      repository: docker.io/library/postgres
      tag: 17.11-bookworm
      pullPolicy: IfNotPresent
    resources: {}
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
    podAnnotations: {}
    podLabels: {}
    persistence:
      enabled: true
      existingClaim: ""
      accessModes: [ReadWriteOnce]
      # Empty uses the cluster default; '-' disables dynamic provisioning.
      storageClass: ""
      annotations: {}
      size: 10Gi

  # -- Existing PostgreSQL or CloudNativePG connection
  external:
    # Required when internal.enabled is false.
    hostname: ""

# -- External Puppet Server used by the image for certificate enrollment
puppetServer:
  hostname: ""
  port: 8140

# -- JVM arguments (extraEnv.PUPPETDB_JAVA_ARGS takes precedence)
javaArgs: ""
# -- Additional certificate DNS names, comma separated
alternateServerNames: ""
# -- Custom conf.d files keyed by filename, mounted individually
customConfig: {}

# -- Persist OpenVoxDB data or reuse an existing claim
persistence:
  enabled: true
  # Suppresses PVC creation when set.
  existingClaim: ""
  accessModes: [ReadWriteOnce]
  # -- Storage class, empty uses cluster default, '-' disables dynamic provisioning
  storageClass: ""
  annotations: {}
  size: 10Gi

# -- Network isolation. Enabled defaults deny traffic except explicitly supplied rules.
networkPolicy:
  enabled: false
  policyTypes: [Ingress, Egress]
  additionalIngressRules: []
  additionalEgressRules: []

# -- Run a Prometheus exporter sidecar and optionally create a ServiceMonitor
metrics:
  enabled: false
  image:
    repository: camptocamp/prometheus-puppetdb-exporter
    tag: 1.1.0
    pullPolicy: IfNotPresent
  port: 9635
  interval: 30s
  resources: {}
  extraEnv: {}
  extraEnvSecret: ""
  # -- Exporter target URL. HTTPS credentials can be mounted using extraVolumes.
  url: http://localhost:8080/pdb/query
  # -- Prometheus Operator integration, requires the ServiceMonitor CRD
  serviceMonitor:
    enabled: false
    namespace: ""
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: ""
    honorLabels: true
    relabelings: []
    metricRelabelings: []
