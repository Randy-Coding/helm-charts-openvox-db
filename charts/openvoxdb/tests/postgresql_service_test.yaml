suite: bundled postgresql service
templates:
  - templates/postgresql-service.yaml
tests:
  - it: exposes PostgreSQL internally
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5432

  - it: creates no service in external mode
    set:
      postgresql.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0
