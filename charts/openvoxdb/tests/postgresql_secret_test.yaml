suite: bundled postgresql credentials
templates:
  - templates/postgresql-secret.yaml
tests:
  - it: creates credentials for bundled PostgreSQL
    set:
      postgresql.internal.password: test-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.username
          value: cHVwcGV0ZGI=
      - equal:
          path: data.password
          value: dGVzdC1wYXNzd29yZA==

  - it: uses configured secret keys
    set:
      postgresql.internal.password: test-password
      postgresql.shared.usernameKey: user
      postgresql.shared.passwordKey: pass
    asserts:
      - isNotNull:
          path: data.user
      - isNotNull:
          path: data.pass

  - it: creates no secret when an existing secret is supplied
    set:
      postgresql.shared.existingSecret: database-app
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no secret in external mode
    set:
      postgresql.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0
