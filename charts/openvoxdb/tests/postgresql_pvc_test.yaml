suite: bundled postgresql data claim
templates:
  - templates/postgresql-pvc.yaml
tests:
  - it: creates persistent storage by default
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: skips creation for an existing claim
    set:
      postgresql.internal.persistence.existingClaim: database-data
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no claim in external mode
    set:
      postgresql.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0
