suite: bundled postgresql
templates:
  - templates/postgresql-statefulset.yaml
tests:
  - it: runs the official PostgreSQL image with secure defaults
    set:
      postgresql.internal.password: test-password
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/library/postgres:17.11-bookworm
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: puppetdb
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-openvoxdb-postgresql

  - it: creates no StatefulSet in external mode
    set:
      postgresql.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: supports an existing data claim and credential secret
    set:
      postgresql.shared.existingSecret: database-app
      postgresql.internal.persistence.existingClaim: database-data
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: database-app
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: database-data
