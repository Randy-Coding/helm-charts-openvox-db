suite: bundled postgresql initialization
templates:
  - templates/postgresql-configmap.yaml
tests:
  - it: installs the extensions required by OpenVoxDB
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["10-openvoxdb-extensions.sql"]
          pattern: CREATE EXTENSION IF NOT EXISTS pg_trgm
      - matchRegex:
          path: data["10-openvoxdb-extensions.sql"]
          pattern: CREATE EXTENSION IF NOT EXISTS pgcrypto

  - it: creates no initialization config in external mode
    set:
      postgresql.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0
